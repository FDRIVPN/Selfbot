<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کد تایید</title>
    <style>
        body { font-family: Tahoma, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { background: #0088cc; color: white; border: none; cursor: pointer; }
        button:hover { background: #006699; }
    </style>
</head>
<body>
    <h2>📱 کد تایید را وارد کنید</h2>
    <p>کد ۵ رقمی به تلگرام شما ارسال شد.</p>
    <form method="post" action="/verify_code">
        <input type="text" name="code" placeholder="کد ۵ رقمی" required>
        <button type="submit">تایید</button>
    </form>
</body>
</html>
