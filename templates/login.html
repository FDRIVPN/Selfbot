<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل میو</title>
    <style>
        body { font-family: Tahoma, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { background: #0088cc; color: white; border: none; cursor: pointer; }
        button:hover { background: #006699; }
    </style>
</head>
<body>
    <h2>🔐 ورود به پنل میو</h2>
    <form method="post" action="/send_code">
        <label>شماره موبایل (با کد کشور):</label>
        <input type="text" name="phone" placeholder="مثال: 989031774645" required>
        <button type="submit">ارسال کد تایید</button>
    </form>
</body>
</html>
