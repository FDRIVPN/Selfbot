{% extends "base.html" %}
{% block title %}افزودن اکانت{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-8 mt-10">
    <h1 class="text-2xl font-bold text-center mb-6">افزودن اکانت تلگرام</h1>
    <form method="POST" action="{{ url_for('send_code_route') }}">
        <label class="block mb-2 font-medium">شماره موبایل (با کد کشور)</label>
        <input type="text" name="phone" placeholder="98912xxxxxxx" required
               class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
               dir="ltr">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg">
            ارسال کد تایید
        </button>
    </form>
    <div class="mt-6 text-center">
        <a href="{{ url_for('admin') }}" class="text-blue-600 hover:underline">ورود به پنل مدیریت</a>
    </div>
</div>
{% endblock %}
