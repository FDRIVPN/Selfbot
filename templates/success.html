<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>ثبت موفق</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body{font-family:Tahoma;background:#fdf6e3;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
        .card{background:#fff;border-radius:20px;padding:40px;box-shadow:0 10px 40px rgba(0,0,0,.1);text-align:center;max-width:400px}
        h2{color:#34a853}
        p{color:#4a3724;line-height:1.8}
        i{font-size:48px;color:#34a853}
    </style>
</head>
<body>
    <div class="card">
        <i class="bi bi-check-circle-fill"></i>
        <h2>حساب شما با موفقیت ثبت شد</h2>
        <p>شماره <strong>{{ phone }}</strong> به سیستم اضافه گردید.<br>
        <strong>برای فعال‌سازی سلف‌بات، به ادمین اطلاع دهید.</strong><br>
        تا زمان تأیید، ربات فعالیتی نخواهد داشت.</p>
    </div>
</body>
</html>
