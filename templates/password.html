<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رمز دوم</title>
    <style>
        body { font-family: Tahoma, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { background: #0088cc; color: white; border: none; cursor: pointer; }
        button:hover { background: #006699; }
    </style>
</head>
<body>
    <h2>🔑 رمز دوم خود را وارد کنید</h2>
    <p>حساب شما رمز دوم دارد.</p>
    <form method="post" action="/verify_password">
        <input type="password" name="password" placeholder="رمز دوم" required>
        <button type="submit">تایید</button>
    </form>
</body>
</html>
