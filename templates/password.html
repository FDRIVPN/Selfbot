{% extends "base.html" %}
{% block title %}رمز دو مرحله‌ای{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-8 mt-10">
    <h1 class="text-2xl font-bold text-center mb-2">رمز دو مرحله‌ای</h1>
    <p class="text-center text-gray-600 mb-6">اکانت دارای رمز دو مرحله‌ای است</p>
    <form method="POST" action="{{ url_for('verify_password') }}">
        <input type="password" name="password" placeholder="رمز دو مرحله‌ای" required autofocus
               class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg">
            تایید رمز
        </button>
    </form>
</div>
{% endblock %}
