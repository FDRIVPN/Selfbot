<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>ورود ادمین</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Tahoma,sans-serif;background:linear-gradient(135deg,#fdf6e3,#f5e6ca);min-height:100vh;display:flex;justify-content:center;align-items:center}
        .login-card{background:#fff;border-radius:28px;padding:40px 38px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.1);text-align:center}
        h3{color:#3d2c1b;margin-bottom:20px}
        .input-group{position:relative;margin-bottom:16px}
        .input-group i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#a09080;font-size:18px}
        input[type="password"]{width:100%;padding:12px 40px 12px 12px;border:2px solid #ede5d8;border-radius:12px;font-size:16px;outline:none}
        input[type="password"]:focus{border-color:#e8850e}
        .btn-login{width:100%;padding:14px;background:linear-gradient(135deg,#e8850e,#d97706);color:#fff;border:none;border-radius:16px;font-size:18px;font-weight:700;cursor:pointer;transition:all .3s}
        .btn-login:hover{transform:scale(1.02);box-shadow:0 8px 30px rgba(232,133,14,.35)}
        .error{color:#ea4335;margin-top:10px}
    </style>
</head>
<body>
    <div class="login-card">
        <h3><i class="bi bi-shield-lock-fill"></i> ورود به پنل مدیریت</h3>
        <form method="POST">
            <div class="input-group">
                <i class="bi bi-lock-fill"></i>
                <input type="password" name="password" placeholder="رمز عبور" required>
            </div>
            <button type="submit" class="btn-login"><i class="bi bi-box-arrow-in-right"></i> ورود</button>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, msg in messages %}
              <div class="error"><i class="bi bi-exclamation-triangle-fill"></i> {{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
    </div>
</body>
</html>
