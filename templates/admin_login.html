{% extends "base.html" %}
{% block title %}ورود ادمین{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-8 mt-16">
    <h1 class="text-2xl font-bold text-center mb-6">ورود به پنل مدیریت</h1>
    <form method="POST">
        <input type="password" name="password" placeholder="رمز پنل" required autofocus
               class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg">
            ورود
        </button>
    </form>
    <div class="mt-6 text-center">
        <a href="{{ url_for('index') }}" class="text-blue-600 hover:underline">افزودن اکانت جدید</a>
    </div>
</div>
{% endblock %}
