{% extends "base.html" %}
{% block title %}داشبورد مدیریت{% endblock %}

{% block content %}
<style>
    .card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        padding: 20px;
        margin-bottom: 20px;
    }
    .account-btn {
        display: inline-block;
        padding: 8px 14px;
        margin: 4px;
        border-radius: 8px;
        border: 1px solid #ddd;
        text-decoration: none;
        color: #333;
        font-size: 14px;
    }
    .account-btn.active {
        background: #2563eb;
        color: white;
        border-color: #2563eb;
    }
    .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-left: 6px;
    }
    .status-dot.on { background: #22c55e; }
    .status-dot.off { background: #9ca3af; }
    .switch-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 15px 0;
    }
    .switch-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        cursor: pointer;
        user-select: none;
    }
    .group-list {
        max-height: 320px;
        overflow-y: auto;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 10px;
    }
    .group-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border-radius: 6px;
    }
    .group-item:hover {
        background: #f9fafb;
    }
    .btn {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-weight: bold;
        text-decoration: none;
        font-size: 14px;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-success { background: #16a34a; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-gray { background: #6b7280; color: white; }
    input[type="text"], input[type="number"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
    }
    .field {
        margin: 14px 0;
    }
    .field label {
        font-weight: bold;
        display: block;
        margin-bottom: 6px;
    }
    .hint {
        font-size: 12px;
        color: #6b7280;
        margin-top: 4px;
    }
</style>

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
    <h1 style="margin:0; font-size:22px;">پنل مدیریت سلف‌بات</h1>
    <div style="display:flex; gap:8px;">
        <a href="{{ url_for('index') }}" class="btn btn-success">+ افزودن اکانت</a>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">خروج</a>
    </div>
</div>

<div class="card">
    <h3 style="margin-top:0;">اکانت‌ها</h3>
    <div>
        {% for u in all_users %}
            <a href="{{ url_for('switch_user', phone=u.phone) }}"
               class="account-btn {% if managed_phone == u.phone %}active{% endif %}">
                <span dir="ltr">{{ u.phone }}</span>
                <span class="status-dot {% if u.is_active %}on{% else %}off{% endif %}"></span>
            </a>
        {% else %}
            <p style="color:#6b7280;">هنوز اکانتی اضافه نشده</p>
        {% endfor %}
    </div>
</div>

{% if user %}
<form method="POST" action="{{ url_for('save_settings') }}">

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="margin:0;">
                تنظیمات:
                <span dir="ltr" style="color:#2563eb;">{{ managed_phone }}</span>
            </h3>
            <button type="submit" form="remove-form" class="btn btn-danger"
                    onclick="return confirm('آیا از حذف این اکانت مطمئن هستید؟')"

                حذف اکانت
            </button>
        </div>

                <span>فعال بودن اکانت</span>
